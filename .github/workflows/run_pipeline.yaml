name: Run Pipeline

on:
  schedule:
    - cron: "0 9,12,15 * * *"
  workflow_dispatch:
    inputs:
      config:
        description: 'Config profile name (filename without .yaml in config/)'
        type: string
        default: 'default'
      runner:
        description: 'Runner to use'
        type: choice
        options:
          - github
          - aws
        default: 'github'

permissions:
  id-token: write
  contents: read

jobs:
  load-config:
    runs-on: ${{ inputs.runner == 'aws' && 'self-hosted' || 'ubuntu-latest' }}
    outputs:
      # ingest
      ingest-lookback-hours: ${{ steps.parse.outputs.ingest-lookback-hours }}
      ingest-sources: ${{ steps.parse.outputs.ingest-sources }}
      ingest-load-object-store: ${{ steps.parse.outputs.ingest-load-object-store }}
      ingest-load-db: ${{ steps.parse.outputs.ingest-load-db }}
      # embed
      embed-date: ${{ steps.parse.outputs.embed-date }}
      embed-model: ${{ steps.parse.outputs.embed-model }}
      embed-batch-size: ${{ steps.parse.outputs.embed-batch-size }}
      embed-word-limit: ${{ steps.parse.outputs.embed-word-limit }}
      embed-no-title: ${{ steps.parse.outputs.embed-no-title }}
      embed-no-summary: ${{ steps.parse.outputs.embed-no-summary }}
      embed-no-text: ${{ steps.parse.outputs.embed-no-text }}
      embed-overwrite: ${{ steps.parse.outputs.embed-overwrite }}
      embed-load-object-store: ${{ steps.parse.outputs.embed-load-object-store }}
      embed-load-db: ${{ steps.parse.outputs.embed-load-db }}
      # entities
      entities-date: ${{ steps.parse.outputs.entities-date }}
      entities-model: ${{ steps.parse.outputs.entities-model }}
      entities-batch-size: ${{ steps.parse.outputs.entities-batch-size }}
      entities-word-limit: ${{ steps.parse.outputs.entities-word-limit }}
      entities-overwrite: ${{ steps.parse.outputs.entities-overwrite }}
      entities-load-object-store: ${{ steps.parse.outputs.entities-load-object-store }}
      entities-load-db: ${{ steps.parse.outputs.entities-load-db }}
      # resolve
      resolve-date: ${{ steps.parse.outputs.resolve-date }}
      resolve-overwrite: ${{ steps.parse.outputs.resolve-overwrite }}
      resolve-load-object-store: ${{ steps.parse.outputs.resolve-load-object-store }}
      resolve-load-db: ${{ steps.parse.outputs.resolve-load-db }}
      # cluster
      cluster-date: ${{ steps.parse.outputs.cluster-date }}
      cluster-embedding-model: ${{ steps.parse.outputs.cluster-embedding-model }}
      cluster-min-cluster-size: ${{ steps.parse.outputs.cluster-min-cluster-size }}
      cluster-min-samples: ${{ steps.parse.outputs.cluster-min-samples }}
      cluster-overwrite: ${{ steps.parse.outputs.cluster-overwrite }}
      cluster-load-object-store: ${{ steps.parse.outputs.cluster-load-object-store }}
      cluster-load-db: ${{ steps.parse.outputs.cluster-load-db }}
      # classify
      classify-date: ${{ steps.parse.outputs.classify-date }}
      classify-model: ${{ steps.parse.outputs.classify-model }}
      classify-batch-size: ${{ steps.parse.outputs.classify-batch-size }}
      classify-threshold: ${{ steps.parse.outputs.classify-threshold }}
      classify-word-limit: ${{ steps.parse.outputs.classify-word-limit }}
      classify-overwrite: ${{ steps.parse.outputs.classify-overwrite }}
      classify-load-object-store: ${{ steps.parse.outputs.classify-load-object-store }}
      classify-load-db: ${{ steps.parse.outputs.classify-load-db }}
      # stories
      stories-date: ${{ steps.parse.outputs.stories-date }}
      stories-model: ${{ steps.parse.outputs.stories-model }}
      stories-overwrite: ${{ steps.parse.outputs.stories-overwrite }}
      stories-load-object-store: ${{ steps.parse.outputs.stories-load-object-store }}
      stories-load-db: ${{ steps.parse.outputs.stories-load-db }}
      # link_stories
      link-stories-model: ${{ steps.parse.outputs.link-stories-model }}
      link-stories-n-candidates: ${{ steps.parse.outputs.link-stories-n-candidates }}
      link-stories-delete-existing: ${{ steps.parse.outputs.link-stories-delete-existing }}
    steps:
      - uses: actions/checkout@v4
      - name: Parse config
        id: parse
        run: |
          CONFIG="config/${{ inputs.config || 'default' }}.yaml"
          if [ ! -f "$CONFIG" ]; then
            echo "::error::Config file not found: $CONFIG"
            exit 1
          fi

          # Convert YAML config to JSON once, then use jq for value lookups.
          # Uses explicit null check instead of // which treats false and 0 as falsy.
          CONFIG_JSON=$(yq -o json '.' "$CONFIG")
          val() { echo "$CONFIG_JSON" | jq -r "if $1 == null then \"$2\" else $1 end"; }

          # ingest
          echo "ingest-lookback-hours=$(val '.ingest.lookback_hours' '12')" >> "$GITHUB_OUTPUT"
          echo "ingest-sources=$(val '.ingest.sources' 'all')" >> "$GITHUB_OUTPUT"
          echo "ingest-load-object-store=$(val '.ingest.load_object_store' 'true')" >> "$GITHUB_OUTPUT"
          echo "ingest-load-db=$(val '.ingest.load_db' 'true')" >> "$GITHUB_OUTPUT"

          # embed
          echo "embed-date=$(val '.embed.date' '')" >> "$GITHUB_OUTPUT"
          echo "embed-model=$(val '.embed.model' 'all-MiniLM-L6-v2')" >> "$GITHUB_OUTPUT"
          echo "embed-batch-size=$(val '.embed.batch_size' '32')" >> "$GITHUB_OUTPUT"
          echo "embed-word-limit=$(val '.embed.word_limit' '300')" >> "$GITHUB_OUTPUT"
          echo "embed-no-title=$(val '.embed.no_title' 'false')" >> "$GITHUB_OUTPUT"
          echo "embed-no-summary=$(val '.embed.no_summary' 'false')" >> "$GITHUB_OUTPUT"
          echo "embed-no-text=$(val '.embed.no_text' 'false')" >> "$GITHUB_OUTPUT"
          echo "embed-overwrite=$(val '.embed.overwrite' 'true')" >> "$GITHUB_OUTPUT"
          echo "embed-load-object-store=$(val '.embed.load_object_store' 'true')" >> "$GITHUB_OUTPUT"
          echo "embed-load-db=$(val '.embed.load_db' 'true')" >> "$GITHUB_OUTPUT"

          # entities
          echo "entities-date=$(val '.entities.date' '')" >> "$GITHUB_OUTPUT"
          echo "entities-model=$(val '.entities.model' 'en_core_web_trf')" >> "$GITHUB_OUTPUT"
          echo "entities-batch-size=$(val '.entities.batch_size' '32')" >> "$GITHUB_OUTPUT"
          echo "entities-word-limit=$(val '.entities.word_limit' '300')" >> "$GITHUB_OUTPUT"
          echo "entities-overwrite=$(val '.entities.overwrite' 'true')" >> "$GITHUB_OUTPUT"
          echo "entities-load-object-store=$(val '.entities.load_object_store' 'true')" >> "$GITHUB_OUTPUT"
          echo "entities-load-db=$(val '.entities.load_db' 'true')" >> "$GITHUB_OUTPUT"

          # resolve
          echo "resolve-date=$(val '.resolve.date' '')" >> "$GITHUB_OUTPUT"
          echo "resolve-overwrite=$(val '.resolve.overwrite' 'true')" >> "$GITHUB_OUTPUT"
          echo "resolve-load-object-store=$(val '.resolve.load_object_store' 'true')" >> "$GITHUB_OUTPUT"
          echo "resolve-load-db=$(val '.resolve.load_db' 'true')" >> "$GITHUB_OUTPUT"

          # cluster
          echo "cluster-date=$(val '.cluster.date' '')" >> "$GITHUB_OUTPUT"
          echo "cluster-embedding-model=$(val '.cluster.embedding_model' 'all-MiniLM-L6-v2')" >> "$GITHUB_OUTPUT"
          echo "cluster-min-cluster-size=$(val '.cluster.min_cluster_size' '2')" >> "$GITHUB_OUTPUT"
          echo "cluster-min-samples=$(val '.cluster.min_samples' '0')" >> "$GITHUB_OUTPUT"
          echo "cluster-overwrite=$(val '.cluster.overwrite' 'true')" >> "$GITHUB_OUTPUT"
          echo "cluster-load-object-store=$(val '.cluster.load_object_store' 'true')" >> "$GITHUB_OUTPUT"
          echo "cluster-load-db=$(val '.cluster.load_db' 'true')" >> "$GITHUB_OUTPUT"

          # classify
          echo "classify-date=$(val '.classify.date' '')" >> "$GITHUB_OUTPUT"
          echo "classify-model=$(val '.classify.model' 'ContextNews/news-classifier')" >> "$GITHUB_OUTPUT"
          echo "classify-batch-size=$(val '.classify.batch_size' '32')" >> "$GITHUB_OUTPUT"
          echo "classify-threshold=$(val '.classify.threshold' '0.5')" >> "$GITHUB_OUTPUT"
          echo "classify-word-limit=$(val '.classify.word_limit' '0')" >> "$GITHUB_OUTPUT"
          echo "classify-overwrite=$(val '.classify.overwrite' 'false')" >> "$GITHUB_OUTPUT"
          echo "classify-load-object-store=$(val '.classify.load_object_store' 'true')" >> "$GITHUB_OUTPUT"
          echo "classify-load-db=$(val '.classify.load_db' 'true')" >> "$GITHUB_OUTPUT"

          # stories
          echo "stories-date=$(val '.stories.date' '')" >> "$GITHUB_OUTPUT"
          echo "stories-model=$(val '.stories.model' 'gpt-4o-mini')" >> "$GITHUB_OUTPUT"
          echo "stories-overwrite=$(val '.stories.overwrite' 'true')" >> "$GITHUB_OUTPUT"
          echo "stories-load-object-store=$(val '.stories.load_object_store' 'true')" >> "$GITHUB_OUTPUT"
          echo "stories-load-db=$(val '.stories.load_db' 'true')" >> "$GITHUB_OUTPUT"

          # link_stories
          echo "link-stories-model=$(val '.link_stories.model' 'gpt-4o-mini')" >> "$GITHUB_OUTPUT"
          echo "link-stories-n-candidates=$(val '.link_stories.n_candidates' '3')" >> "$GITHUB_OUTPUT"
          echo "link-stories-delete-existing=$(val '.link_stories.delete_existing' 'false')" >> "$GITHUB_OUTPUT"

  ingest:
    needs: load-config
    uses: ./.github/workflows/ingest_articles.yaml
    secrets: inherit
    with:
      runner: ${{ inputs.runner }}
      lookback-hours: ${{ fromJSON(needs.load-config.outputs.ingest-lookback-hours) }}
      sources: ${{ needs.load-config.outputs.ingest-sources }}
      load-object-store: ${{ fromJSON(needs.load-config.outputs.ingest-load-object-store) }}
      load-db: ${{ fromJSON(needs.load-config.outputs.ingest-load-db) }}

  # Embed, extract-entities, and classify run in parallel after ingest
  embed:
    needs: [ingest, load-config]
    uses: ./.github/workflows/compute_embeddings.yaml
    secrets: inherit
    with:
      runner: ${{ inputs.runner }}
      published-date: ${{ needs.load-config.outputs.embed-date }}
      model: ${{ needs.load-config.outputs.embed-model }}
      batch-size: ${{ fromJSON(needs.load-config.outputs.embed-batch-size) }}
      word-limit: ${{ fromJSON(needs.load-config.outputs.embed-word-limit) }}
      no-title: ${{ fromJSON(needs.load-config.outputs.embed-no-title) }}
      no-summary: ${{ fromJSON(needs.load-config.outputs.embed-no-summary) }}
      no-text: ${{ fromJSON(needs.load-config.outputs.embed-no-text) }}
      overwrite: ${{ fromJSON(needs.load-config.outputs.embed-overwrite) }}
      load-object-store: ${{ fromJSON(needs.load-config.outputs.embed-load-object-store) }}
      load-db: ${{ fromJSON(needs.load-config.outputs.embed-load-db) }}

  extract-entities:
    needs: [ingest, load-config]
    uses: ./.github/workflows/extract_entities.yaml
    secrets: inherit
    with:
      runner: ${{ inputs.runner }}
      published-date: ${{ needs.load-config.outputs.entities-date }}
      model: ${{ needs.load-config.outputs.entities-model }}
      batch-size: ${{ fromJSON(needs.load-config.outputs.entities-batch-size) }}
      word-limit: ${{ fromJSON(needs.load-config.outputs.entities-word-limit) }}
      overwrite: ${{ fromJSON(needs.load-config.outputs.entities-overwrite) }}
      load-object-store: ${{ fromJSON(needs.load-config.outputs.entities-load-object-store) }}
      load-db: ${{ fromJSON(needs.load-config.outputs.entities-load-db) }}

  classify:
    needs: [ingest, load-config]
    uses: ./.github/workflows/classify_articles.yaml
    secrets: inherit
    with:
      runner: ${{ inputs.runner }}
      published-date: ${{ needs.load-config.outputs.classify-date }}
      model: ${{ needs.load-config.outputs.classify-model }}
      batch-size: ${{ fromJSON(needs.load-config.outputs.classify-batch-size) }}
      threshold: ${{ needs.load-config.outputs.classify-threshold }}
      word-limit: ${{ fromJSON(needs.load-config.outputs.classify-word-limit) }}
      overwrite: ${{ fromJSON(needs.load-config.outputs.classify-overwrite) }}
      load-object-store: ${{ fromJSON(needs.load-config.outputs.classify-load-object-store) }}
      load-db: ${{ fromJSON(needs.load-config.outputs.classify-load-db) }}

  # Resolve entities after entities are extracted
  resolve-entities:
    needs: [extract-entities, load-config]
    uses: ./.github/workflows/resolve_entities.yaml
    secrets: inherit
    with:
      runner: ${{ inputs.runner }}
      published-date: ${{ needs.load-config.outputs.resolve-date }}
      overwrite: ${{ fromJSON(needs.load-config.outputs.resolve-overwrite) }}
      load-object-store: ${{ fromJSON(needs.load-config.outputs.resolve-load-object-store) }}
      load-db: ${{ fromJSON(needs.load-config.outputs.resolve-load-db) }}

  # Cluster only needs embeddings
  cluster:
    needs: [embed, load-config]
    uses: ./.github/workflows/cluster_articles.yaml
    secrets: inherit
    with:
      runner: ${{ inputs.runner }}
      ingested-date: ${{ needs.load-config.outputs.cluster-date }}
      embedding-model: ${{ needs.load-config.outputs.cluster-embedding-model }}
      min-cluster-size: ${{ fromJSON(needs.load-config.outputs.cluster-min-cluster-size) }}
      min-samples: ${{ fromJSON(needs.load-config.outputs.cluster-min-samples) }}
      overwrite-clusters: ${{ fromJSON(needs.load-config.outputs.cluster-overwrite) }}
      load-object-store: ${{ fromJSON(needs.load-config.outputs.cluster-load-object-store) }}
      load-db: ${{ fromJSON(needs.load-config.outputs.cluster-load-db) }}

  # Generate stories after clustering, entity resolution, and article classification
  generate-stories:
    needs: [cluster, resolve-entities, classify, load-config]
    uses: ./.github/workflows/generate_stories.yaml
    secrets: inherit
    with:
      runner: ${{ inputs.runner }}
      cluster-period: ${{ needs.load-config.outputs.stories-date }}
      model: ${{ needs.load-config.outputs.stories-model }}
      overwrite: ${{ fromJSON(needs.load-config.outputs.stories-overwrite) }}
      load-object-store: ${{ fromJSON(needs.load-config.outputs.stories-load-object-store) }}
      load-db: ${{ fromJSON(needs.load-config.outputs.stories-load-db) }}

  # Link today's stories to related stories from the previous day
  link-stories:
    needs: [generate-stories, load-config]
    uses: ./.github/workflows/link_stories.yaml
    secrets: inherit
    with:
      runner: ${{ inputs.runner }}
      date-b: ${{ needs.load-config.outputs.stories-date }}
      model: ${{ needs.load-config.outputs.link-stories-model }}
      n-candidates: ${{ fromJSON(needs.load-config.outputs.link-stories-n-candidates) }}
      delete-existing: ${{ fromJSON(needs.load-config.outputs.link-stories-delete-existing) }}
